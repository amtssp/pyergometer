          });
        }
        pulseChart.setPointerCapture(event.pointerId);
        if (dragType === 'duration') renderChart(latestChart);
        event.preventDefault();
      });

      pulseChart.addEventListener('pointermove', function (event) {
        if (!chartDrag) return;
        var position = chartPosition(event);
        var plotHeight = chartGeometry.plotHeight;
        if (chartDrag.type === 'target' && chartDrag.kind === 'power') {
          var desiredPower = chartDrag.startValue -
            (position.y - chartDrag.startY) * chartDrag.maxScale / plotHeight;
          var power = Math.max(25, Math.min(1000, Math.round(desiredPower / 5) * 5));
          setBlockField(chartDrag.index, chartDrag.field, power);
        } else if (chartDrag.type === 'target') {
          var desiredPulse = chartDrag.pulse -
            (position.y - chartDrag.startY) * chartDrag.maxScale / plotHeight;
          var percent = Math.max(1, Math.min(100,
            Math.round(desiredPulse / chartDrag.maxPulse * 100)));
          setBlockField(chartDrag.index, chartDrag.field, percent);
        } else {
          // Same plot width as renderChart, so the handle moves with the pointer.
          var deltaSeconds = (position.x - chartDrag.startX) / chartGeometry.plotWidth *
            chartDrag.scaleDuration;
          if (chartDrag.secondsField) {
            // A repeat phase: 5-second steps, the same for every repetition.
            var seconds = Math.max(5, Math.min(3600,
              chartDrag.startSeconds + Math.round(deltaSeconds / 5) * 5));
            if (seconds !== parseInt(blocks.querySelectorAll('.block')[chartDrag.index]
                .querySelector('.' + chartDrag.secondsField).value, 10)) {
              setBlockField(chartDrag.index, chartDrag.secondsField, seconds);
            }
            event.preventDefault();
            return;
          }
          // Snap to half minutes, never shorter than 30 seconds.
          var duration = Math.max(0.5, Math.min(
            720 - chartDrag.otherMinutes, chartDrag.minutes + Math.round(deltaSeconds / 30) / 2));
          if (duration !== parseFloat(blocks.querySelectorAll('.block')[chartDrag.index]
              .querySelector('.minutes').value)) {
            setBlockField(chartDrag.index, 'minutes', duration);
          }
        }
        event.preventDefault();
      });

      function finishChartDrag(event) {
        if (!chartDrag) return;
        var wasDuration = chartDrag.type === 'duration';
        chartDrag = null;
        if (pulseChart.hasPointerCapture(event.pointerId)) {
          pulseChart.releasePointerCapture(event.pointerId);
        }
        if (wasDuration) renderChart(latestChart);
        scheduleLiveUpdate(true);
      }

      pulseChart.addEventListener('pointerup', finishChartDrag);
      pulseChart.addEventListener('pointercancel', finishChartDrag);

      function pollChart() {
        if (chartPollBusy) return;
        chartPollBusy = true;
        var revision = chartRevision;
        fetch('/api/chart').then(function (response) {
          return response.json().then(function (data) {
            if (!response.ok) throw new Error(I18N.serverError(data, 'error.chart'));
            return data;
          });
        }).then(function (data) {
          if (revision === chartRevision) {
            latestChart = data;
            renderChart(data);
            updatePulseBadge(data);
            updateTestGuide(data);
            updateAdjustButtons();
            updateWorkoutName();
            updateDemoButton();
          }
        }).catch(function (error) {
          chartMessage.textContent = error.message;
        }).then(function () {
          chartPollBusy = false;
        });
      }

      function resetChart() {
        chartRevision += 1;
        return fetch('/api/chart/reset', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({})
        }).then(function (response) {
          return response.json().then(function (data) {
            if (!response.ok) throw new Error(I18N.serverError(data, 'error.resetChart'));
            latestChart = {plan: null, elapsed: 0, points: [], mode: 'preview', active: false};
            editedChartPlan = null;
            renderChart(latestChart);
          });
        });
      }

      function resetFormForProfile() {
        blocks.textContent = '';
        blocks.classList.remove('has-blocks');
        setWorkoutMode('pulse', false);
        status.className = '';
        status.textContent = '';
        applyProfileMaxPulse();
        setWorkoutName(null);
        planBeforeLoad = null;
        document.getElementById('load-note').hidden = true;
        presetName.value = '';
        builtinTemplate.value = '';
        updatePresetOptions([]);
        updateSummary();
      }

      function addBlock(type, values) {
        values = values || {};
        var powerMode = workoutMode === 'power';
        var row = document.createElement('fieldset');
        row.className = 'block';
        row.dataset.type = type;
        if (values.label) row.dataset.label = values.label;
        if (values.test) row.dataset.test = values.test;

        var title = document.createElement('h3');
        title.textContent = values.label || t(
          type === 'repeat' ? (powerMode ? 'block.repeat.power' : 'block.repeat.pulse')
            : type === 'recovery' ? 'block.recovery'
            : type === 'ramp' ? 'block.ramp'
              : type === 'break' ? 'block.break'
                : powerMode ? 'block.step' : 'block.interval');
        row.appendChild(title);

        var fields = document.createElement('div');
        fields.className = 'fields';
        if (type === 'repeat') {
          fields.appendChild(makeField(t('field.count'), 'number',
            values.count || 13, 1, 100, 1, 'count'));
          fields.appendChild(makeField(t('field.workSeconds'), 'number',
            values.work_seconds || 30, 1, 3600, 1, 'work-seconds'));
          fields.appendChild(powerMode
            ? makeField(t('field.workPower'), 'number', values.work_power || 250, 25, 1000, 1, 'work-power')
            : makeField(t('field.workPercent'), 'number',
              values.work_percent || 85, 1, 100, 1, 'work-percent'));
          fields.appendChild(makeField(t('field.recoverySeconds'), 'number',
            values.recovery_seconds || 30, 1, 3600, 1, 'recovery-seconds'));
          fields.appendChild(powerMode
            ? makeField(t('field.recoveryPower'), 'number', values.recovery_power || 120, 25, 1000, 1, 'recovery-power')
            : makeField(t('field.recoveryPercent'), 'number',
              values.recovery_percent || 60, 1, 100, 1, 'recovery-percent'));
        } else if (type === 'recovery') {
          fields.appendChild(makeField(t('field.seconds'), 'number',
            values.seconds || 60, 30, 300, 5, 'seconds'));
        } else if (type === 'ramp') {
          if (powerMode) {
            fields.appendChild(makeField(t('field.startPower'), 'number',
              values.start_power || 100, 25, 1000, 1, 'start-power'));
            fields.appendChild(makeField(t('field.endPower'), 'number',
              values.end_power || 200, 25, 1000, 1, 'end-power'));
          } else {
            fields.appendChild(makeField(t('field.startPercent'), 'number',
              values.start_percent || 55, 1, 100, 1, 'start-percent'));
            fields.appendChild(makeField(t('field.endPercent'), 'number',
              values.end_percent || 75, 1, 100, 1, 'end-percent'));
          }
        } else if (type === 'interval' && powerMode) {
          fields.appendChild(makeField(t('field.power'), 'number',
            values.power || 150, 25, 1000, 1, 'power'));
        } else if (type === 'interval') {
          fields.appendChild(makeField(t('field.percent'), 'number',
            values.percent || 70, 1, 100, 1, 'percent'));
        } else {
          fields.appendChild(makeField(t('field.power'), 'number',
            values.power || 60, 25, 400, 5, 'power'));
        }
        if (type !== 'repeat' && type !== 'recovery') {
          fields.appendChild(makeField(t('field.minutes'), 'number',
            values.minutes || (type === 'break' ? 2 : 5), 0.5, 720, 0.5, 'minutes'));
        }
        row.appendChild(fields);

        var actions = document.createElement('div');
        actions.className = 'actions';
        [
          [t('block.moveUp'), -1],
          [t('block.moveDown'), 1]
        ].forEach(function (item) {
          var move = document.createElement('button');
          move.type = 'button';
          move.textContent = item[0];
          move.addEventListener('click', function () {
            var sibling = item[1] < 0 ? row.previousElementSibling : row.nextElementSibling;
            if (!sibling) return;
            if (item[1] < 0) blocks.insertBefore(row, sibling);
            else blocks.insertBefore(sibling, row);
            updateSummary();
          });
          actions.appendChild(move);
        });

        var remove = document.createElement('button');
        remove.type = 'button';
        remove.textContent = t('block.remove');
        remove.addEventListener('click', function () {
          blocks.removeChild(row);
          updateSummary();
        });
        actions.appendChild(remove);
        row.appendChild(actions);

        row.addEventListener('input', function () {
          updateSummary();
          scheduleLiveUpdate(false);
        });
        blocks.appendChild(row);
        blocks.classList.toggle('has-blocks', blocks.children.length > 0);
        updateSummary();
      }

      function astrandTemplate() {
        // Classic suggestion: about 75 W for women and 100 W for men; adjust so that the
        // pulse ends between 120 and 170.
        var profile = profilesByName[activeProfile] || {};
        var load = profile.sex === 'male' ? 100 : 75;
        return {
          mode: 'power',
          message: t('template.message.astrand', {watts: load}),
          blocks: [
            {type: 'interval', label: t('template.block.warmup'), minutes: 3,
             power: Math.max(25, Math.round(load / 10) * 5)},
            {type: 'interval', label: t('template.block.astrand'), minutes: 6, power: load, test: 'astrand'},
            {type: 'recovery', seconds: 60}
          ]
        };
      }

      function setWorkoutMode(mode, convertBlocks) {
        var previous = convertBlocks ? readBlocks() : null;
        workoutMode = mode === 'power' ? 'power' : 'pulse';
        pulseLimitBox.checked = true;
        document.querySelector('input[name="workout-mode"][value="' + workoutMode + '"]').checked = true;
        var powerMode = workoutMode === 'power';
        document.getElementById('add-break').hidden = powerMode;
        document.getElementById('add-interval').textContent = t(powerMode ? 'add.step' : 'add.interval');
        document.getElementById('mode-help').textContent =
          t(powerMode ? 'mode.help.power' : 'mode.help.pulse');
        if (previous) {
          // Durations and repeats are kept; targets get the new mode's defaults,
          // except that a pause becomes a watt step at the same load.
          blocks.textContent = '';
          blocks.classList.remove('has-blocks');
          previous.forEach(function (block) {
            var values = {label: block.label, minutes: block.minutes, seconds: block.seconds,
              count: block.count, test: powerMode ? block.test : undefined,
              work_seconds: block.work_seconds, recovery_seconds: block.recovery_seconds};
            var type = block.type;
            if (type === 'break' && powerMode) {
              type = 'interval';
              values.power = block.power;
            }
            addBlock(type, values);
          });
        }
        updateSummary();
      }

      function workoutModified() {
        return Boolean(workoutName) &&
          JSON.stringify([workoutMode, readBlocks()]) !== loadedBlocksSignature;
      }

      function workoutLabel() {
        if (!workoutName) return t('workout.new');
        return workoutModified() ? t('workout.modifiedName', {name: workoutName}) : workoutName;
      }

      function setWorkoutName(name) {
        workoutName = name || null;
        loadedBlocksSignature = workoutName ? JSON.stringify([workoutMode, readBlocks()]) : null;
        updateWorkoutName();
      }

      function updateWorkoutName() {
        var chart = latestChart;
        var running = chart && chart.active && chart.mode !== 'preview' && chart.plan;
        workoutNameState.className = 'muted';
        if (running) {
          workoutNameElement.textContent = chart.plan.name || t('workout.new');
          workoutNameState.textContent = t(chart.mode === 'demo' ? 'workout.state.demo' : 'workout.state.running');
          workoutNameState.className = 'running';
        } else if (workoutName) {
          workoutNameElement.textContent = workoutName;
          workoutNameState.textContent = workoutModified() ? t('workout.state.modified') : '';
        } else {
          workoutNameElement.textContent = t(blocks.children.length ? 'workout.new' : 'workout.none');
          workoutNameState.textContent = blocks.children.length ? t('workout.state.unsaved') : '';
        }
      }

      function getPlan() {
        var useBirthYear = maxPulseSource() === 'birth_year';
        var pulseSource = document.querySelector('input[name="pulse-source"]:checked').value;
        return {
          name: workoutLabel(),
          profile: activeProfile,
          mode: workoutMode,
          pulse_limit: pulseLimitBox.checked,
          max_pulse_source: useBirthYear ? 'age' : 'manual',
          max_pulse: useBirthYear ? null : parseInt(maxPulse.value, 10),
          age: useBirthYear ? selectedAge() : null,
          pulse_source: pulseSource,
          heart_rate_address: pulseSource === 'watch' ? watchDevice.value : null,
          device: document.getElementById('device').value,
          device_type: selectedDeviceType().id,
          blocks: readBlocks()
        };
      }

      function readBlocks() {
        var powerMode = workoutMode === 'power';
        var integer = function (row, className) {
          return parseInt(row.querySelector('.' + className).value, 10);
        };
        var items = [];
        Array.prototype.forEach.call(blocks.querySelectorAll('.block'), function (row) {
          var item = {type: row.dataset.type};
          if (row.dataset.label) item.label = row.dataset.label;
          if (row.dataset.test) item.test = row.dataset.test;
          if (item.type === 'repeat') {
            item.count = integer(row, 'count');
            item.work_seconds = integer(row, 'work-seconds');
            item.recovery_seconds = integer(row, 'recovery-seconds');
            if (powerMode) {
              item.work_power = integer(row, 'work-power');
              item.recovery_power = integer(row, 'recovery-power');
            } else {
              item.work_percent = integer(row, 'work-percent');
              item.recovery_percent = integer(row, 'recovery-percent');
            }
          } else if (item.type === 'recovery') {
            item.seconds = integer(row, 'seconds');
          } else {
            item.minutes = parseFloat(row.querySelector('.minutes').value);
          }
          if (item.type === 'interval' && !powerMode) {
            item.percent = integer(row, 'percent');
          } else if (item.type === 'interval' || item.type === 'break') {
            item.power = integer(row, 'power');
          } else if (item.type === 'ramp' && powerMode) {
            item.start_power = integer(row, 'start-power');
            item.end_power = integer(row, 'end-power');
          } else if (item.type === 'ramp') {
            item.start_percent = integer(row, 'start-percent');
            item.end_percent = integer(row, 'end-percent');
          }
          items.push(item);
        });
        return items;
      }

      function updatePresetOptions(presets) {
        savedPresets.textContent = '';
        var placeholder = document.createElement('option');
        placeholder.value = '';
        placeholder.textContent = t('choose.saved.placeholder');
        savedPresets.appendChild(placeholder);
        presets.forEach(function (preset) {
          var option = document.createElement('option');
          option.value = preset.name;
          option.textContent = preset.name;
          savedPresets.appendChild(option);
        });
      }

      function renderProfiles(profiles, selectedName) {
        profilesByName = {};
        userProfile.textContent = '';
        profiles.forEach(function (profile) {
          profilesByName[profile.name] = profile;
          var option = document.createElement('option');
          option.value = profile.name;
          option.textContent = profile.name;
          userProfile.appendChild(option);
        });
        if (!profiles.length) throw new Error(t('status.noProfiles'));
        activeProfile = profilesByName[selectedName] ? selectedName : profiles[0].name;
        userProfile.value = activeProfile;
        rememberProfile(activeProfile);
        applyProfileWatch();
        applyProfileMaxPulse();
      }

      function applyProfileWatch() {
        var profile = profilesByName[activeProfile];
        var watch = profile && profile.watch;
        removeWatchButton.hidden = !watch;
        var source = document.querySelector(
          'input[name="pulse-source"][value="' + (watch ? 'watch' : 'ergometer') + '"]'
        );
        if (!source.checked) {
          source.checked = true;
          source.dispatchEvent(new Event('change'));
        }
        watchDevice.textContent = '';
        var option = document.createElement('option');
        option.value = '';
        option.textContent = t(watch ? 'watch.useSaved' : 'watch.scanFirst');
        watchDevice.appendChild(option);
        if (watch) {
          var savedOption = document.createElement('option');
          savedOption.value = watch.address;
          savedOption.textContent = t('watch.savedFor',
            {name: watch.name, profile: activeProfile, address: watch.address});
          savedOption.dataset.name = watch.name;
          watchDevice.appendChild(savedOption);
          watchDevice.value = watch.address;
          watchStatus.className = 'muted';
          watchStatus.textContent = t('watch.savedStatus', {name: watch.name});
        } else {
          watchStatus.className = 'muted';
          watchStatus.textContent = t('watch.choosePrompt');
        }
      }

      function initializeProfiles() {
        return fetch('/api/profiles').then(function (response) {
          return response.json().then(function (data) {
            if (!response.ok) throw new Error(I18N.serverError(data, 'error.profiles'));
            var savedName = null;
            try {
              savedName = window.localStorage.getItem('pyergometer-profile');
            } catch (error) {
              status.className = 'error';
              status.textContent = t('status.readProfileFailed');
            }
            renderProfiles(data.profiles, savedName);
            return data.profiles;
          });
        });
      }

      function loadPresetList() {
        if (!activeProfile) return Promise.resolve([]);
        return fetch('/api/presets?profile=' + encodeURIComponent(activeProfile)).then(function (response) {
          return response.json().then(function (data) {
            if (!response.ok) throw new Error(I18N.serverError(data, 'error.presets'));
            updatePresetOptions(data.presets);
            return data.presets;
          });
        });
      }

      function applyPreset(preset) {
        blocks.textContent = '';
        blocks.classList.remove('has-blocks');
        setWorkoutMode(preset.plan.mode || 'pulse', false);
        preset.plan.blocks.forEach(function (block) {
          addBlock(block.type, block);
        });
        presetName.value = preset.name;
        setWorkoutName(preset.name);
        updateMaxPulseResult();
        updateSummary();
      }

      userProfile.addEventListener('change', function () {
        activeProfile = userProfile.value;
        rememberProfile(activeProfile);
        applyProfileWatch();
        applyProfileMaxPulse();
        resetChart().then(function () {
          resetFormForProfile();
          return loadPresetList();
        }).catch(function (error) {
          status.className = 'error';
          status.textContent = error.message;
        });
      });

      document.getElementById('create-profile').addEventListener('click', function () {
        var name = newProfileName.value.trim();
        if (!name) {
          status.className = 'error';
          status.textContent = t('status.profileNameMissing');
          newProfileName.focus();
          return;
        }
        fetch('/api/profiles', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({action: 'create', name: name})
        }).then(function (response) {
          return response.json().then(function (data) {
            if (!response.ok) throw new Error(I18N.serverError(data, 'error.createProfile'));
            return data.profiles;
          });
        }).then(function (profiles) {
          renderProfiles(profiles, name);
          newProfileName.value = '';
          resetFormForProfile();
          return resetChart().then(loadPresetList);
        }).then(function () {
          status.className = 'success';
          status.textContent = t('status.profileCreated');
        }).catch(function (error) {
          status.className = 'error';
          status.textContent = error.message;
        });
      });

      removeWatchButton.addEventListener('click', function () {
        var profileName = activeProfile;
        if (!profileName) return;
        fetch('/api/profiles', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({action: 'remove-watch', profile: profileName})
        }).then(function (response) {
          return response.json().then(function (data) {
            if (!response.ok) throw new Error(I18N.serverError(data, 'error.removeWatch'));
            return data.profiles;
          });
        }).then(function (profiles) {
          renderProfiles(profiles, profileName);
          flashSaved(watchSaved, t('saved.watchRemoved', {profile: profileName}));
        }).catch(function (error) {
          status.className = 'error';
          status.textContent = error.message;
        });
      });

      watchDevice.addEventListener('change', function () {
        var option = watchDevice.options[watchDevice.selectedIndex];
        if (!watchDevice.value || !option.dataset.name || !activeProfile) return;
        fetch('/api/profiles', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            action: 'save-watch',
            profile: activeProfile,
            watch: {name: option.dataset.name, address: watchDevice.value}
          })
        }).then(function (response) {
          return response.json().then(function (data) {
            if (!response.ok) throw new Error(I18N.serverError(data, 'error.saveWatch'));
            return data.profiles;
          });
        }).then(function (profiles) {
          renderProfiles(profiles, activeProfile);
          flashSaved(watchSaved, t('saved.watch', {profile: activeProfile}));
        }).catch(function (error) {
          status.className = 'error';
          status.textContent = error.message;
        });
      });

      document.getElementById('save-preset').addEventListener('click', function () {
        status.className = '';
        status.textContent = '';
        if (!presetName.value.trim()) {
          status.className = 'error';
          status.textContent = t('status.presetNameMissing');
          presetName.focus();
          return;
        }
        var plan = getPlan();
        if (!plan.blocks.length) {
          status.className = 'error';
          status.textContent = t('status.noBlocks');
          return;
        }
        var inputs = blocks.querySelectorAll('input');
        for (var index = 0; index < inputs.length; index += 1) {
          if (!inputs[index].checkValidity()) {
            inputs[index].reportValidity();
            return;
          }
        }
        fetch('/api/presets', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            profile: activeProfile,
            name: presetName.value,
            plan: {mode: plan.mode, blocks: plan.blocks}
          })
        }).then(function (response) {
          return response.json().then(function (data) {
            if (!response.ok) throw new Error(I18N.serverError(data, 'error.savePreset'));
            updatePresetOptions(data.presets);
            savedPresets.value = '';
            setWorkoutName(presetName.value.trim());
            status.className = 'success';
            status.textContent = t('status.presetSaved');
          });
        }).catch(function (error) {
          status.className = 'error';
          status.textContent = error.message;
        });
      });

      // ------------------------------------------------ load on selection, with undo
      var planBeforeLoad = null;

      function snapshotPlan() {
        return {mode: workoutMode, blocks: readBlocks(), name: workoutName,
          signature: loadedBlocksSignature, presetName: presetName.value,
          pulseLimit: pulseLimitBox.checked};
      }

      function showLoaded(name, before) {
        // Undo is only offered when there was a plan to go back to.
        planBeforeLoad = before && before.blocks.length ? before : null;
        document.getElementById('load-note-text').textContent = t('load.loaded', {name: name});
        document.getElementById('undo-load').hidden = !planBeforeLoad;
        document.getElementById('load-note').hidden = false;
      }

      document.getElementById('undo-load').addEventListener('click', function () {
        if (!planBeforeLoad) return;
        var plan = planBeforeLoad;
        planBeforeLoad = null;
        blocks.textContent = '';
        blocks.classList.remove('has-blocks');
        setWorkoutMode(plan.mode, false);
        plan.blocks.forEach(function (block) { addBlock(block.type, block); });
        pulseLimitBox.checked = plan.pulseLimit;
        presetName.value = plan.presetName;
        workoutName = plan.name;
        loadedBlocksSignature = plan.signature;
        updateSummary();
        document.getElementById('load-note').hidden = true;
        status.className = 'success';
        status.textContent = t('load.undone');
        resetChart().catch(function () { /* the chart refreshes on the next poll */ });
      });

      savedPresets.addEventListener('change', function () {
        var selectedName = savedPresets.value;
        if (!selectedName) return;
        var before = snapshotPlan();
        status.className = '';
        status.textContent = '';
        loadPresetList().then(function (presets) {
          var preset = presets.filter(function (item) {
            return item.name === selectedName;
          })[0];
          if (!preset) throw new Error(t('status.presetMissing'));
          applyPreset(preset);
          savedPresets.value = '';
          showLoaded(preset.name, before);
        }).catch(function (error) {
          status.className = 'error';
          status.textContent = error.message;
        });
      });

      function demoRunning() {
        return Boolean(latestChart && latestChart.mode === 'demo' && latestChart.active);
      }

      // The demo button stops a running livedemo; Start still begins a real workout.
      function updateDemoButton() {
        document.getElementById('start-demo').textContent =
          t(demoRunning() ? 'demo.stop' : 'demo.button');
      }

      document.getElementById('start-demo').addEventListener('click', function () {
        status.className = '';
        status.textContent = '';
        if (demoRunning()) {
          resetChart().then(function () {
            updateDemoButton();
            updatePulseBadge(latestChart);
            updateTestGuide(latestChart);
            updateAdjustButtons();
            updateWorkoutName();
            status.className = 'success';
            status.textContent = t('status.demoStopped');
          }).catch(function (error) {
            status.className = 'error';
            status.textContent = error.message;
          });
          return;
        }
        var plan = getPlan();
        if (workoutMode === 'pulse' && !requireMaxPulse()) return;
        if (!plan.blocks.length) {
          status.className = 'error';
          status.textContent = t('status.demoEmpty');
          return;
        }
        fetch('/api/demo', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(plan)
        }).then(function (response) {
          return response.json().then(function (data) {
            if (!response.ok) throw new Error(I18N.serverError(data, 'error.demo'));
            return data;
          });
        }).then(function () {
          status.className = 'success';
          status.textContent = t('status.demoStarted');
          pollChart();
        }).catch(function (error) {
          status.className = 'error';
          status.textContent = error.message;
        });
      });

      // Consecutive failed status polls; a single miss (e.g. a server restart) is ignored.
      var statusFailures = 0;
      var DISCONNECTED_TEXT = t('status.disconnected');

      function formatTestResults(tests) {
        return (tests || []).map(function (test) {
          var text;
          if (test.type === 'astrand') {
            text = ' ' + t(test.valid ? 'result.astrand' : 'result.astrand.invalid');
            if (test.vo2max) {
              text += ' ' + t('result.vo2max', {value: I18N.number(test.vo2max)});
            }
            if (test.pulse) text += ' ' + t('result.astrand.pulse', {pulse: test.pulse, watts: test.watts});
          } else {
            text = ' ' + t(test.valid ? 'result.ramp' : 'result.ramp.invalid');
            if (test.map_watts) {
              text += ' ' + t('result.ramp.power', {map: test.map_watts, ftp: test.ftp_watts});
            }
            if (test.max_pulse) text += ', ' + t('result.maxPulse', {pulse: test.max_pulse});
            if (test.vo2max) text += ', ' + t('result.vo2max', {value: I18N.number(test.vo2max)});
          }
          return text + (test.problems && test.problems.length
            ? '. ' + test.problems.map(I18N.problem).join(' ') : '.');
        }).join('');
      }

      function refreshStatus() {
        fetch('/api/status').then(function (response) {
          return response.json();
        }).then(function (data) {
          if (statusFailures >= 2 && status.textContent === DISCONNECTED_TEXT) {
            status.className = 'success';
            status.textContent = t('status.reconnected');
            window.setTimeout(function () {
              if (status.textContent === t('status.reconnected')) {
                status.className = '';
                status.textContent = '';
              }
            }, 4000);
          }
          statusFailures = 0;
          // While a start waits for the watch, keep the page locked as if it were running.
          var starting = data.starting === true;
          busy = data.running || starting;
          stopping = data.stopping;
          canStop = data.can_stop === true;
          startButton.disabled = starting || stopping || (busy && !canStop);
          document.body.classList.toggle('workout-running', data.running);
          startButton.textContent = t(starting ? 'start.connecting'
            : stopping ? 'start.stopping'
              : busy ? canStop ? 'start.stop' : 'start.needsRestart'
                : 'start.start');
          startButton.classList.toggle('danger', data.running && canStop);
          startButton.classList.toggle('primary', !data.running);
          document.querySelectorAll('input[name="pulse-source"]').forEach(function (radio) {
            radio.disabled = busy;
          });
          document.getElementById('scan-watches').disabled = busy;
          watchDevice.disabled = busy;
          removeWatchButton.disabled = busy;
          deviceTypeSelect.disabled = busy;
          languageSelect.disabled = busy;
          document.getElementById('device').disabled = busy;
          userProfile.disabled = busy;
          updatePulseLimitToggle();
          document.querySelectorAll('input[name="workout-mode"]').forEach(function (radio) {
            radio.disabled = busy;
          });
          maxPulse.disabled = busy || maxPulseSource() === 'birth_year';
          birthYearInput.disabled = busy;
          sexSelect.disabled = busy;
          weightInput.disabled = busy;
          document.querySelectorAll('input[name="max-pulse-source"]').forEach(function (radio) {
            radio.disabled = busy;
          });
          newProfileName.disabled = busy;
          document.getElementById('create-profile').disabled = busy;
          savedPresets.disabled = busy;
          builtinTemplate.disabled = busy;
          if (data.heart_rate) {
            if (data.heart_rate.fresh) {
              watchStatus.className = 'success';
              watchStatus.textContent = t('watch.connected', {pulse: data.heart_rate.pulse});
            } else {
              watchStatus.className = 'error';
              watchStatus.textContent = data.heart_rate.error + (!busy ? ''
                : '. ' + t(workoutMode === 'power' ? 'watch.lost.power' : 'watch.lost.pulse'));
            }
          }
          if (starting) {
            status.className = '';
            status.textContent = t('status.connectingWatch');
          } else if (busy) {
            if (stopping) {
              status.className = '';
              status.textContent = t('status.stopping');
            } else if (!canStop) {
              status.className = 'muted';
              status.textContent = t('status.needsRestart');
            } else if (data.heart_rate && !data.heart_rate.fresh && workoutMode === 'power') {
              status.className = 'muted';
              status.textContent = t('status.waitingWatchPower');
            } else if (data.heart_rate && !data.heart_rate.fresh) {
              status.className = 'error';
              status.textContent = t('status.watchError');
            } else {
              status.className = '';
              status.textContent = t('status.running');
            }
          } else if (status.textContent === t('status.connectingWatch')) {
            status.className = '';
            status.textContent = '';
          } else if (data.error) {
            status.className = 'error';
            status.textContent = data.error;
          } else if (data.exit_code === 0) {
            status.className = 'success';
            status.textContent = t('status.finished') + formatTestResults(data.tests) + ' ' +
              t('status.logFile', {log: 'data/' + data.log});
          } else if (data.exit_code !== null) {
            status.className = 'error';
            status.textContent = t('status.failed', {code: data.exit_code});
          }
        }).catch(function () {
          statusFailures += 1;
          if (statusFailures >= 2) {
            status.className = 'error';
            status.textContent = DISCONNECTED_TEXT;
          }
        });
      }

      document.getElementById('add-interval').addEventListener('click', function () {
        addBlock('interval');
      });
      document.getElementById('add-break').addEventListener('click', function () {
        addBlock('break');
      });
      document.getElementById('add-repeat').addEventListener('click', function () {
        addBlock('repeat');
      });
      document.getElementById('add-ramp').addEventListener('click', function () {
        addBlock('ramp');
      });
      document.getElementById('add-recovery').addEventListener('click', function () {
        addBlock('recovery');
      });
      Array.prototype.forEach.call(
        document.querySelectorAll('input[name="workout-mode"]'),
        function (radio) {
          radio.addEventListener('change', function () {
            if (this.checked) setWorkoutMode(this.value, true);
          });
        }
      );
      setWorkoutMode('pulse', false);
      pulseLimitBox.addEventListener('change', updatePulseLimitToggle);
      builtinTemplate.addEventListener('change', function () {
        if (!builtinTemplate.value) return;
        var before = snapshotPlan();
        var templates = {
          // The pulse cannot follow 30-second intervals, so this one sets the watts.
          'hiit-30-30': {
            mode: 'power',
            message: t('template.message.hiit-30-30'),
            blocks: [
              {type: 'interval', label: t('template.block.warmup'), minutes: 4, power: 80},
              {
                type: 'repeat',
                count: 13,
                work_seconds: 30,
                work_power: 150,
                recovery_seconds: 30,
                recovery_power: 50
              },
              {type: 'break', label: t('template.block.cooldown'), minutes: 3, power: 25}
            ]
          },
          // Long intervals give the pulse time to rise, so the pulse control can follow.
          'pulse-3x3': {
            mode: 'pulse',
            message: t('template.message.pulse-3x3'),
            blocks: [
              {type: 'interval', label: t('template.block.warmup'), minutes: 5, percent: 60},
              {
                type: 'repeat',
                count: 3,
                work_seconds: 180,
                work_percent: 85,
                recovery_seconds: 180,
                recovery_percent: 65
              },
              {type: 'break', label: t('template.block.cooldown'), minutes: 3, power: 25}
            ]
          },
          'vo2max-5x5': {
            mode: 'power',
            message: t('template.message.vo2max-5x5'),
            blocks: [
              {type: 'ramp', label: t('template.block.warmup'), minutes: 5.5, start_power: 100, end_power: 168},
              {type: 'interval', label: t('template.block.opener'), minutes: 1.5, power: 220},
              {type: 'interval', label: t('template.block.easy'), minutes: 2, power: 125},
              {
                type: 'repeat',
                count: 5,
                work_seconds: 60,
                work_power: 285,
                recovery_seconds: 75,
                recovery_power: 130
              },
              {type: 'ramp', label: t('template.block.cooldown'), minutes: 8, start_power: 150, end_power: 105}
            ]
          },
          'astrand': astrandTemplate(),
          'ramp-test': {
            mode: 'power',
            pulse_limit: false,
            message: t('template.message.ramp-test'),
            blocks: [
              {type: 'interval', label: t('template.block.warmup'), minutes: 5, power: 50},
              {type: 'ramp', label: t('template.block.ramp'),
               minutes: 30, start_power: 50, end_power: 650, test: 'ramp'}
            ]
          }
        };
        var selectedTemplate = templates[builtinTemplate.value];
        if (!selectedTemplate) {
          status.className = 'error';
          status.textContent = t('status.chooseTemplate');
          return;
        }
        blocks.textContent = '';
        blocks.classList.remove('has-blocks');
        setWorkoutMode(selectedTemplate.mode, false);
        // A maximal test must be allowed to reach the maximum pulse.
        pulseLimitBox.checked = selectedTemplate.pulse_limit !== false;
        selectedTemplate.blocks.forEach(function (block) {
          addBlock(block.type, block);
        });
        presetName.value = '';
        var templateName = builtinTemplate.options[builtinTemplate.selectedIndex].textContent;
        setWorkoutName(templateName);
        builtinTemplate.value = '';
        showLoaded(templateName, before);
        status.className = 'success';
        status.textContent = selectedTemplate.message + ' ' + t('status.templateLoaded');
        resetChart().catch(function (error) {
          status.className = 'error';
          status.textContent = error.message;
        });
      });
      maxPulse.addEventListener('change', function () {
        updateMaxPulseResult();
        updateSummary();
        saveProfileMaxPulse();
      });
      birthYearInput.addEventListener('input', function () {
        updateMaxPulseResult();
        updateSummary();
      });
      birthYearInput.addEventListener('change', saveProfileMaxPulse);
      birthYearInput.addEventListener('change', saveProfileDetails);
      sexSelect.addEventListener('change', saveProfileDetails);
      weightInput.addEventListener('change', saveProfileDetails);
      Array.prototype.forEach.call(
        document.querySelectorAll('input[name="max-pulse-source"]'),
        function (radio) {
          radio.addEventListener('change', function () {
            updateMaxPulseSource();
            saveProfileMaxPulse();
          });
        }
      );
      updateMaxPulseSource();
      deviceTypeSelect.addEventListener('change', function () {
        document.getElementById('device-label').hidden = !selectedDeviceType().needs_port;
      });
      deviceTypeSelect.dispatchEvent(new Event('change'));

      function saveBikeSettings() {
        fetch('/api/bike-settings', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            device_type: selectedDeviceType().id,
            device: document.getElementById('device').value
          })
        }).then(function (response) {
          return response.json().then(function (data) {
            if (!response.ok) throw new Error(I18N.serverError(data, 'error.bikeSettings'));
          });
        }).then(function () {
          flashSaved(document.getElementById('bike-saved'), t('saved.plain'));
        }).catch(function (error) {
          status.className = 'error';
          status.textContent = error.message;
        });
      }
      deviceTypeSelect.addEventListener('change', saveBikeSettings);
      document.getElementById('device').addEventListener('change', saveBikeSettings);
      Array.prototype.forEach.call(
        document.querySelectorAll('input[name="pulse-source"]'),
        function (radio) {
          radio.addEventListener('change', function () {
            var useWatch = document.querySelector(
              'input[name="pulse-source"]:checked').value === 'watch';
            watchSettings.hidden = !useWatch;
          });
        }
      );
      document.querySelector('input[name="pulse-source"][value="ergometer"]').dispatchEvent(
        new Event('change')
      );
      document.getElementById('scan-watches').addEventListener('click', function () {
        watchStatus.className = 'muted';
        watchStatus.textContent = t('watch.scanning');
        fetch('/api/heart-rate/scan', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({})
        }).then(function (response) {
          return response.json().then(function (data) {
            if (!response.ok) throw new Error(I18N.serverError(data, 'error.scan'));
            return data.devices;
          });
        }).then(function (devices) {
          watchDevice.textContent = '';
          var placeholder = document.createElement('option');
          placeholder.value = '';
          placeholder.textContent = devices.length
            ? t('watch.select')
            : t('watch.noneFound');
          watchDevice.appendChild(placeholder);
          devices.forEach(function (device) {
            var option = document.createElement('option');
            option.value = device.address;
            option.dataset.name = device.name;
            option.textContent = device.name +
              (device.heart_rate_service ? ' · ' + t('watch.heartRateService') : '') +
              (device.rssi === null ? '' : ' · ' + device.rssi + ' dBm') +
              ' (' + device.address + ')';
            watchDevice.appendChild(option);
          });
          var savedWatch = profilesByName[activeProfile] &&
            profilesByName[activeProfile].watch;
          if (savedWatch && !devices.some(function (device) {
            return device.address === savedWatch.address;
          })) {
            var savedOption = document.createElement('option');
            savedOption.value = savedWatch.address;
            savedOption.dataset.name = savedWatch.name;
            savedOption.textContent = t('watch.saved', {name: savedWatch.name, address: savedWatch.address});
            watchDevice.appendChild(savedOption);
          }
          if (savedWatch) watchDevice.value = savedWatch.address;
          watchStatus.className = devices.length ? 'muted' : 'error';
          watchStatus.textContent = devices.length
            ? t('watch.chooseFound')
            : t(savedWatch ? 'watch.savedNotFound' : 'watch.checkSharing');
        }).catch(function (error) {
          watchStatus.className = 'error';
          watchStatus.textContent = error.message;
        });
      });

      startButton.addEventListener('click', function () {
        if (busy) {
          if (stopping) return;
          stopping = true;
          startButton.disabled = true;
          startButton.textContent = t('start.stopping');
          status.className = '';
          status.textContent = t('status.sendingStop');
          fetch('/api/stop', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({})
          }).then(function (response) {
            return response.json().then(function (data) {
              if (!response.ok) throw new Error(I18N.serverError(data, 'error.stop'));
              return data;
            });
          }).then(function () {
            status.textContent = t('status.stopSent');
            refreshStatus();
          }).catch(function (error) {
            stopping = false;
            startButton.disabled = false;
            startButton.textContent = t('start.stop');
            status.className = 'error';
            status.textContent = error.message;
          });
          return;
        }

        status.className = '';
        status.textContent = '';
        var plan = getPlan();
        if (plan.pulse_source === 'watch' && !plan.heart_rate_address) {
          status.className = 'error';
          status.textContent = t('status.chooseWatch');
          return;
        }
        if (workoutMode === 'pulse' && !requireMaxPulse()) return;
        if (!plan.blocks.length) {
          status.className = 'error';
          status.textContent = t('status.noBlocks');
          return;
        }
        var inputs = blocks.querySelectorAll('input');
        for (var index = 0; index < inputs.length; index += 1) {
          if (!inputs[index].checkValidity()) {
            inputs[index].reportValidity();
            return;
          }
        }
        if (selectedDeviceType().needs_port && !plan.device.trim()) {
          status.className = 'error';
          status.textContent = t('status.portMissing');
          return;
        }
        busy = true;
        startButton.disabled = true;
        if (plan.pulse_source === 'watch') {
          watchStatus.className = 'muted';
          watchStatus.textContent = t('watch.connecting');
          status.textContent = t('status.connectingSmartwatch');
        }
        fetch('/api/start', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(plan)
        }).then(function (response) {
          return response.json().then(function (data) {
            if (!response.ok) throw new Error(I18N.serverError(data, 'error.start'));
            return data;
          });
        }).then(function () {
          status.className = '';
          status.textContent = t('status.started');
          startButton.textContent = t('start.stop');
          startButton.classList.remove('primary');
          startButton.classList.add('danger');
          refreshStatus();
        }).catch(function (error) {
          busy = false;
          stopping = false;
          startButton.disabled = false;
          startButton.textContent = t('start.start');
          startButton.classList.remove('danger');
          startButton.classList.add('primary');
          status.className = 'error';
          status.textContent = error.message;
        });
      });

      addBlock('interval');
      initializeProfiles().then(function () {
        return loadPresetList();
      }).catch(function (error) {
        status.className = 'error';
        status.textContent = error.message;
      });
      window.setInterval(refreshStatus, 2000);
      window.setInterval(pollChart, 1000);
      refreshStatus();
      pollChart();
    }());
  </script>
  <script>
    (function () {
      var settingsPanel = document.getElementById('settings-panel');
      var profilePanel = document.getElementById('profile-panel');
      var planPanel = document.getElementById('plan-panel');
      var settingsHint = document.getElementById('settings-hint');
      var profileHint = document.getElementById('profile-hint');
      var maxPulseResult = document.getElementById('max-pulse-result');
      var blocks = document.getElementById('blocks');
      var autoOpened = false;

      function updateHints() {
        var source = document.querySelector('input[name="pulse-source"]:checked');
        var typeSelect = document.getElementById('device-type');
        var typeLabel = typeSelect.options.length
          ? typeSelect.options[typeSelect.selectedIndex].textContent : '';
        var needsPort = !document.getElementById('device-label').hidden;
        var device = document.getElementById('device').value.trim();
        profileHint.textContent = maxPulseResult.textContent +
          ' · ' + t(source && source.value === 'watch' ? 'hint.watch' : 'hint.ergometer');
        var languageSelect = document.getElementById('language');
        settingsHint.textContent = typeLabel +
          (needsPort ? ' · ' + (device || t('hint.noPort')) : '') +
          (languageSelect.options.length
            ? ' · ' + languageSelect.options[languageSelect.selectedIndex].textContent : '');
      }

      // Show the panels that still need input the first time the page has loaded its profile.
      function openWhatIsMissing() {
        if (autoOpened) return;
        autoOpened = true;
        if (!/\d/.test(maxPulseResult.textContent)) profilePanel.open = true;
        if (!blocks.children.length) planPanel.open = true;
      }

      [settingsPanel, profilePanel].forEach(function (panel) {
        panel.addEventListener('change', updateHints);
        panel.addEventListener('input', updateHints);
      });
      // Profile and preset loads change the fields from script without firing events.
      setInterval(updateHints, 1000);
      setTimeout(openWhatIsMissing, 1500);
      updateHints();
    }());
  </script>
</body>
</html>
