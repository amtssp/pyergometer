<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="page.title">Pyergometer</title>
  <script src="/i18n.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef2f6;
      --card: #ffffff;
      --ink: #17212b;
      --muted: #5b6b7a;
      --line: #dbe3ea;
      --field: #f7f9fb;
      --accent: #145da0;
      --accent-ink: #ffffff;
      --go: #1f8a4c;
      --stop: #c62828;
      --radius: 14px;
      --shadow: 0 1px 2px rgba(16, 32, 48, .06), 0 4px 16px rgba(16, 32, 48, .06);
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    * { box-sizing: border-box; }
    /* Elements with their own display value must still disappear when hidden. */
    [hidden] { display: none !important; }
    body {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 1rem 4rem;
      background: var(--bg);
      -webkit-tap-highlight-color: transparent;
    }
    h1, h2, h3 { margin: 0; letter-spacing: -.01em; }
    h2 { font-size: 1.15rem; }
    h3 { font-size: 1rem; }

    /* Sticky control bar: the things used during every workout */
    .topbar {
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      z-index: 10;
      margin: 0 -1rem 1rem;
      padding: .75rem 1rem;
      background: rgba(238, 242, 246, .92);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }
    /* On a phone or tablet the bar wraps to several rows and would hide the chart. */
    @media (max-width: 760px), (max-height: 700px) {
      .topbar { position: static; }
    }
    .topbar-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: .75rem 1rem;
    }
    .brand { display: flex; align-items: center; gap: .6rem; margin-right: auto; }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 2.4rem;
      height: 2.4rem;
      border-radius: 10px;
      color: #fff;
      background: linear-gradient(135deg, #bf3434, #e2683c);
      font-size: 1.25rem;
    }
    .brand h1 { font-size: 1.2rem; }
    .brand small { display: block; color: var(--muted); font-size: .8rem; }
    .profile-pick { display: flex; align-items: center; gap: .5rem; font-weight: 600; }
    .profile-pick select { min-width: 9rem; }
    .nav-link {
      display: inline-flex;
      align-items: center;
      min-height: 2.6rem;
      padding: .5rem .9rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--accent);
      background: #fff;
      font-weight: 600;
      text-decoration: none;
    }
    .nav-link:hover { background: #f0f4f8; }
    #start {
      min-width: 12rem;
      min-height: 3.25rem;
      padding: .6rem 1.5rem;
      font-size: 1.15rem;
      font-weight: 700;
      border-radius: 999px;
      box-shadow: 0 4px 14px rgba(20, 93, 160, .3);
    }
    #start.primary { background: var(--go); border-color: var(--go); box-shadow: 0 4px 14px rgba(31, 138, 76, .3); }
    #start.danger { box-shadow: 0 4px 14px rgba(198, 40, 40, .35); }
    #status { min-height: 1.3em; margin-top: .5rem; font-weight: 600; font-size: .92rem; }
    #status:empty { display: none; }

    /* Cards */
    .panel, details.panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.1rem 1.2rem;
      margin-bottom: 1rem;
    }
    .panel-head {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: .5rem 1rem;
      margin-bottom: .6rem;
    }
    details.panel { padding: 0; }
    details.panel > summary {
      display: flex;
      align-items: center;
      gap: .75rem;
      padding: 1rem 1.2rem;
      cursor: pointer;
      list-style: none;
      font-weight: 700;
      font-size: 1.05rem;
      min-height: 3.25rem;
    }
    details.panel > summary::-webkit-details-marker { display: none; }
    details.panel > summary::after {
      content: "";
      width: .55rem;
      height: .55rem;
      margin-left: auto;
      border-right: 2px solid var(--muted);
      border-bottom: 2px solid var(--muted);
      transform: rotate(45deg);
      transition: transform .15s ease;
      flex: none;
    }
    details.panel[open] > summary::after { transform: rotate(-135deg); }
    details.panel > summary .hint {
      font-weight: 400;
      font-size: .88rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }
    details.panel > .details-body {
      padding: 0 1.2rem 1.2rem;
      border-top: 1px solid var(--line);
      padding-top: 1rem;
    }
    .section-label {
      margin: 1.75rem .25rem .6rem;
      color: var(--muted);
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .subsection { margin-top: 1.25rem; padding-top: 1.25rem; border-top: 1px solid var(--line); }
    .subsection-title { margin-bottom: .75rem; }

    /* Form controls */
    .settings, .fields, .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      gap: .9rem;
    }
    label { display: grid; gap: .35rem; font-weight: 600; font-size: .92rem; }
    fieldset {
      margin: 0;
      padding: .5rem .75rem .7rem;
      border: 1px solid var(--line);
      border-radius: 10px;
    }
    legend { padding: 0 .3rem; font-weight: 600; font-size: .92rem; }
    .settings fieldset label { display: flex; align-items: center; gap: .45rem; font-weight: 400; min-height: 2rem; }
    .settings fieldset input[type="radio"] { margin: 0; width: 1.1rem; height: 1.1rem; accent-color: var(--accent); }
    input, select, button {
      font: inherit;
      min-height: 2.6rem;
      padding: .5rem .7rem;
      color: var(--ink);
      border: 1px solid #b5c2ce;
      border-radius: 8px;
      background: var(--field);
    }
    input:focus-visible, select:focus-visible, button:focus-visible, summary:focus-visible {
      outline: 3px solid rgba(20, 93, 160, .35);
      outline-offset: 2px;
    }
    input[type="number"] { width: 8rem; }
    input[type="checkbox"] { min-height: 0; width: 1.1rem; height: 1.1rem; accent-color: var(--accent); }
    input:disabled, select:disabled { background: #e9eef2; color: #7b8894; }
    button {
      cursor: pointer;
      font-weight: 600;
      background: #fff;
      transition: background .12s ease, transform .05s ease;
    }
    button:hover:not(:disabled) { background: #f0f4f8; }
    button:active:not(:disabled) { transform: translateY(1px); }
    button.primary { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
    button.primary:hover:not(:disabled) { background: #0f4c85; }
    button.danger { color: #fff; background: var(--stop); border-color: var(--stop); }
    button.danger:hover:not(:disabled) { background: #a51f1f; }
    button.ghost { background: transparent; border-color: var(--line); }
    button:disabled { cursor: not-allowed; opacity: .55; }
    #start.primary:hover:not(:disabled) { background: #19733f; }

    /* Workout blocks */
    .block h3 { margin: 0 0 .75rem; }
    .block .actions { margin-top: .75rem; }
    #blocks { display: none; }
    #blocks.has-blocks { display: block; margin-bottom: 1rem; }
    #blocks .block {
      margin: 0;
      padding: 1rem 0;
      border-bottom: 1px solid var(--line);
    }
    #blocks .block:first-child { padding-top: 0; }
    #blocks .block:last-child { border-bottom: 0; }
    .block[data-type="repeat"] .fields {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: .65rem;
    }
    .block[data-type="repeat"] .fields label { min-width: 0; font-size: .85rem; }
    .block[data-type="repeat"] .fields input[type="number"] { width: 100%; padding: .45rem; }

    /* Chart */
    #summary { font-size: .92rem; }
    #pulse-chart { display: block; width: 100%; min-height: 18rem; touch-action: none; }
    .test-guide {
      margin: .25rem 0 .5rem;
      padding: .5rem .75rem;
      border-radius: 10px;
      background: #e8f1fb;
      color: #174a7a;
      font-size: .92rem;
      font-weight: 600;
    }
    .test-guide.warn { background: #fff1dc; color: #8a4b00; }
    #chart-message {
      min-height: 1.4em;
      font-size: .92rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* The plan summary changes length with every edit; hide it while riding. */
    body.workout-running #summary { display: none; }
    #chart-help { margin: .25rem 0 .5rem; font-size: .85rem; }
    .chart-foot {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: .75rem 1rem;
      margin-top: .5rem;
    }
    .chart-legend { display: flex; flex-wrap: wrap; gap: .4rem 1rem; font-size: .85rem; color: var(--muted); }
    .legend-item { display: inline-flex; align-items: center; gap: .4rem; }
    .legend-swatch { display: inline-block; width: 1rem; height: .8rem; border-radius: 2px; }
    .legend-target { background: #4a90c2; }
    .legend-break { background: #d5dce3; }
    .legend-watt { background: #e8a23c; }
    .legend-measured { height: 3px; background: #bf3434; }
    .legend-progress { width: 0; height: .9rem; border-left: 2px dashed #293642; border-radius: 0; }

    p { margin: .6rem 0 0; }
    .muted { color: var(--muted); }
    .error { color: var(--stop); }
    .success { color: #176b36; }

    /* Workout name above the chart */
    #chart-title {
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .workout-name {
      display: flex;
      flex-wrap: nowrap;
      align-items: baseline;
      gap: .1rem .6rem;
      margin: .15rem 0 .2rem;
    }
    #workout-name {
      min-width: 0;
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: -.01em;
      /* One line, so a longer name cannot push the chart down. */
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #workout-name-state { flex: none; }
    #workout-name-state { font-size: .88rem; font-weight: 600; }
    #workout-name-state.running { color: #c62828; }

    /* Chart with the +/- buttons on its right */
    .chart-row { display: flex; align-items: center; gap: .75rem; }
    .chart-row > svg { flex: 1 1 auto; min-width: 0; }
    .adjust-buttons { flex: none; display: flex; flex-direction: column; gap: 1.25rem; }
    .adjust-buttons button {
      width: 4.5rem;
      height: 4.5rem;
      padding: 0;
      border-radius: 50%;
      font-size: 2.4rem;
      font-weight: 700;
      line-height: 1;
      color: #fff;
      border: 0;
      box-shadow: 0 4px 12px rgba(16, 32, 48, .18);
      touch-action: manipulation;
    }
    /* Light green and light pink at the same lightness, with dark symbols for contrast. */
    #target-up { background: #a8e0b4; color: #14532d; }
    #target-up:hover:not(:disabled) { background: #8fd49e; }
    #target-down { background: #f5b8cc; color: #7a1538; }
    #target-down:hover:not(:disabled) { background: #ef9fb9; }
    #target-up:disabled, #target-down:disabled {
      background: #dfe5ea; color: #9aa7b3; box-shadow: none; opacity: 1;
    }

    /* Live pulse heart above the chart */
    .chart-head { flex-wrap: nowrap; align-items: center; }
    .chart-head > div:first-child { min-width: 0; }
    .pulse-badge {
      position: relative;
      flex: none;
      display: grid;
      place-items: center;
      width: 7.5rem;
      height: 6.9rem;
      color: #fff;
    }
    .pulse-badge svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .pulse-badge path { fill: #c62828; transition: fill .3s ease; }
    .pulse-badge.idle path { fill: #c3ccd5; }
    .pulse-badge.live svg { animation: heartbeat 1s ease-in-out infinite; transform-origin: 50% 55%; }
    .pulse-value {
      position: relative;
      margin-top: -.5rem;
      text-align: center;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    #pulse-now { display: block; font-size: 2.6rem; font-weight: 800; letter-spacing: -.03em; }
    .pulse-value small { font-size: .8rem; font-weight: 600; opacity: .9; }
    #pulse-target {
      margin-top: .2rem;
      padding: .1rem .5rem;
      border-radius: 999px;
      text-align: center;
      font-size: .85rem;
      font-weight: 600;
      white-space: nowrap;
      transition: background .3s ease, color .3s ease;
    }
    #pulse-target.flash { background: #d7f0dd; color: #14532d; }
    .cadence {
      margin: .3rem auto 0;
      padding: .15rem .55rem;
      width: fit-content;
      border-radius: 8px;
      background: #dcefee;
      color: #0f5650;
      text-align: center;
      font-size: .85rem;
      font-weight: 700;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.06); }
      30% { transform: scale(.98); }
      45% { transform: scale(1.03); }
    }
    @media (prefers-reduced-motion: reduce) {
      .pulse-badge.live svg { animation: none; }
    }
    .saved-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: .25rem .75rem; }
    .saved-tick {
      color: #176b36;
      font-size: .88rem;
      font-weight: 700;
      opacity: 0;
      transition: opacity .25s ease;
    }
    .saved-tick.show { opacity: 1; }
    .limit-toggle {
      display: flex;
      align-items: center;
      gap: .5rem;
      margin: .25rem 0 .5rem;
      font-weight: 600;
    }
    .limit-toggle input { margin: 0; width: 1.2rem; height: 1.2rem; accent-color: #c62828; flex: none; }
    .limit-toggle.off span { color: var(--muted); }
    .mode-switch { margin-bottom: .5rem; }
    .load-note {
      display: flex; flex-wrap: wrap; align-items: center; gap: .25rem .75rem;
      margin: .75rem 0 0; padding: .5rem .75rem; border-radius: 10px;
      background: #e3f4e6; color: #14532d; font-weight: 600;
    }
    .link-button {
      min-height: 0; padding: 0; border: 0; background: none; color: var(--accent);
      font-weight: 700; text-decoration: underline; cursor: pointer;
    }
    .link-button:hover:not(:disabled) { background: none; }
    .mode-switch label { display: flex; align-items: center; gap: .45rem; font-weight: 400; min-height: 2rem; }
    .mode-switch input { margin: 0; width: 1.1rem; height: 1.1rem; accent-color: var(--accent); }
    .details-body > .subsection:first-child { margin-top: 0; padding-top: 0; border-top: 0; }

    @media (max-width: 640px) {
      .brand { margin-right: 0; flex-basis: 100%; }
      .profile-pick { flex: 1 1 auto; }
      .profile-pick select { flex: 1; min-width: 0; }
      #start { flex: 1 1 100%; }
      .settings, .fields { align-items: stretch; flex-direction: column; }
      input[type="number"], select { width: 100%; }
      .block[data-type="repeat"] .fields { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      details.panel > summary .hint { display: none; }
      #pulse-chart { min-height: 0; }
      .adjust-buttons { gap: .75rem; }
      .adjust-buttons button { width: 3.25rem; height: 3.25rem; font-size: 1.8rem; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">&#9829;</span>
        <div>
          <h1>Pyergometer</h1>
          <small data-i18n="brand.subtitle"></small>
        </div>
      </div>
      <label class="profile-pick" for="user-profile"><span data-i18n="top.user"></span>
        <select id="user-profile"></select>
      </label>
      <a id="development-link" class="nav-link" href="/udvikling" data-i18n="top.development"></a>
      <button id="start" class="primary" type="button" data-i18n="start.start"></button>
    </div>
    <div id="status" role="status" aria-live="polite"></div>
  </header>

  <section class="panel" aria-labelledby="chart-title">
    <div class="panel-head chart-head">
      <div>
        <h2 id="chart-title" data-i18n="chart.title.pulse"></h2>
        <div class="workout-name">
          <span id="workout-name" data-i18n="workout.none"></span>
          <span id="workout-name-state" class="muted"></span>
        </div>
        <div id="summary" class="muted" aria-live="polite" data-i18n="summary.empty"></div>
      </div>
      <div>
        <div id="pulse-badge" class="pulse-badge idle" role="img" data-i18n-attr="aria-label:pulse.aria.none">
          <svg viewBox="0 0 100 92" aria-hidden="true">
            <path d="M50 90 C22 70 2 52 2 29 C2 13 14 2 29 2 C39 2 46 8 50 16 C54 8 61 2 71 2 C86 2 98 13 98 29 C98 52 78 70 50 90 Z"/>
          </svg>
          <div class="pulse-value" aria-hidden="true"><span id="pulse-now">--</span><small>bpm</small></div>
        </div>
        <div id="pulse-target" class="muted" data-i18n="pulse.none"></div>
        <div id="cadence" class="cadence" hidden></div>
      </div>
    </div>
    <label id="pulse-limit-row" class="limit-toggle" hidden>
      <input id="pulse-limit" type="checkbox" checked>
      <span id="pulse-limit-text" data-i18n="limit.label"></span>
    </label>
    <div id="test-guide" class="test-guide" hidden aria-live="polite"></div>
    <div id="chart-message" class="muted" aria-live="polite" data-i18n="chart.message.initial"></div>
    <div class="chart-row">
      <svg id="pulse-chart" viewBox="0 0 900 400" role="img" data-i18n-attr="aria-label:chart.aria"></svg>
      <div class="adjust-buttons">
        <button id="target-up" type="button" disabled
                data-i18n-attr="aria-label:adjust.up.aria;title:adjust.up.title">+</button>
        <button id="target-down" type="button" disabled
                data-i18n-attr="aria-label:adjust.down.aria;title:adjust.down.title">&minus;</button>
      </div>
    </div>
    <p id="chart-help" class="muted" data-i18n="chart.help.initial"></p>
    <div class="chart-foot">
      <div class="chart-legend" data-i18n-attr="aria-label:legend.aria">
        <span class="legend-item" id="legend-pulse"><span class="legend-swatch legend-target"></span><span data-i18n="legend.pulse"></span></span>
        <span class="legend-item" id="legend-pause"><span class="legend-swatch legend-break"></span><span data-i18n="legend.pause"></span></span>
        <span class="legend-item" id="legend-watt" hidden><span class="legend-swatch legend-watt"></span><span data-i18n="legend.watt"></span></span>
        <span class="legend-item"><span class="legend-swatch legend-measured"></span><span data-i18n="legend.measured"></span></span>
        <span class="legend-item"><span class="legend-swatch legend-progress"></span><span data-i18n="legend.progress"></span></span>
      </div>
      <button id="start-demo" class="ghost" type="button" data-i18n="demo.button"></button>
    </div>
  </section>

  <section class="panel" aria-labelledby="choose-title">
    <div class="panel-head"><h2 id="choose-title" data-i18n="choose.title"></h2></div>
    <div>
      <div class="actions">
        <label for="saved-presets"><span data-i18n="choose.saved"></span>
          <select id="saved-presets">
            <option value="" data-i18n="choose.saved.placeholder"></option>
          </select>
        </label>
        <label for="builtin-template"><span data-i18n="choose.templates"></span>
          <select id="builtin-template">
            <option value="" data-i18n="choose.templates.placeholder"></option>
            <option value="hiit-30-30" data-i18n="template.name.hiit-30-30"></option>
            <option value="pulse-3x3" data-i18n="template.name.pulse-3x3"></option>
            <option value="vo2max-5x5" data-i18n="template.name.vo2max-5x5"></option>
            <option value="astrand" data-i18n="template.name.astrand"></option>
            <option value="ramp-test" data-i18n="template.name.ramp-test"></option>
          </select>
        </label>
      </div>
      <p id="load-note" class="load-note" hidden>
        <span id="load-note-text"></span>
        <button id="undo-load" class="link-button" type="button" data-i18n="load.undo"></button>
      </p>
      <p class="muted" data-i18n="choose.help"></p>
    </div>
  </section>

  <div class="section-label" data-i18n="section.setup"></div>

  <details class="panel" id="plan-panel">
    <summary><span id="plan-title" data-i18n="plan.title"></span></summary>
    <div class="details-body">
      <fieldset class="mode-switch">
        <legend data-i18n="mode.legend"></legend>
        <label><input type="radio" name="workout-mode" value="pulse" checked> <span data-i18n="mode.pulse"></span></label>
        <label><input type="radio" name="workout-mode" value="power"> <span data-i18n="mode.power"></span></label>
      </fieldset>
      <p id="mode-help" class="muted"></p>
      <div id="blocks"></div>
      <div class="actions">
        <button id="add-interval" type="button" data-i18n="add.interval"></button>
        <button id="add-break" type="button" data-i18n="add.break"></button>
        <button id="add-ramp" type="button" data-i18n="add.ramp"></button>
        <button id="add-recovery" type="button" data-i18n="add.recovery"></button>
        <button id="add-repeat" type="button" data-i18n="add.repeat"></button>
      </div>

      <div class="subsection">
        <div class="settings">
          <label for="preset-name"><span data-i18n="save.label"></span>
            <input id="preset-name" type="text" maxlength="80" data-i18n-attr="placeholder:save.placeholder">
          </label>
          <button id="save-preset" type="button" data-i18n="save.button"></button>
        </div>
        <p class="muted" data-i18n="save.help"></p>

  <details class="panel" id="settings-panel">
    <summary><span id="settings-title" data-i18n="settings.title"></span><span id="settings-hint" class="hint"></span></summary>
    <div class="details-body">
      <div class="subsection">
        <h3 class="subsection-title" data-i18n="settings.bike"></h3>
        <div class="settings">
          <label for="device-type"><span data-i18n="bike.type"></span>
            <select id="device-type"></select>
          </label>
          <label for="device" id="device-label"><span data-i18n="bike.port"></span>
            <input id="device" type="text" data-i18n-attr="placeholder:bike.port.placeholder">
          </label>

          <p class="muted" data-i18n="bike.help"></p>
          <span id="bike-saved" class="saved-tick" role="status"></span>
        </div>
      </div>

      <div class="subsection">
        <h3 class="subsection-title" data-i18n="settings.language"></h3>
        <div class="settings">
          <label for="language"><span data-i18n="settings.language.choose"></span>
            <select id="language"></select>
          </label>
        </div>
        <p class="muted" data-i18n="settings.language.help"></p>
      </div>

  <script>
    (function () {
      I18N.apply();
      // Language: chosen per browser; the page reloads in the new language.
      var languageSelect = document.getElementById('language');
      I18N.languages().forEach(function (language) {
        var option = document.createElement('option');
        option.value = language.code;
        option.textContent = language.name;
        languageSelect.appendChild(option);
      });
      languageSelect.value = I18N.language;
      languageSelect.addEventListener('change', function () {
        I18N.setLanguage(languageSelect.value);
      });
      var maxPulse = document.getElementById('max-pulse');
      var blocks = document.getElementById('blocks');
      var summary = document.getElementById('summary');
      var status = document.getElementById('status');
      var startButton = document.getElementById('start');
      var birthYearInput = document.getElementById('birth-year');
      var sexSelect = document.getElementById('sex');
      var weightInput = document.getElementById('weight');
      var workoutMode = 'pulse';
      var pulseLimitBox = document.getElementById('pulse-limit');
      var chartGeometry = {left: 70, plotWidth: 805, plotHeight: 316};
      var targetUpButton = document.getElementById('target-up');
      var targetDownButton = document.getElementById('target-down');
      var workoutNameElement = document.getElementById('workout-name');
      var workoutNameState = document.getElementById('workout-name-state');
      var workoutName = null;
      var loadedBlocksSignature = null;
      var maxPulseSaved = document.getElementById('max-pulse-saved');
      var watchSaved = document.getElementById('watch-saved');
      var removeWatchButton = document.getElementById('remove-watch');
      var profilePanel = document.getElementById('profile-panel');
      var pulseBadge = document.getElementById('pulse-badge');
      var pulseNow = document.getElementById('pulse-now');
      var pulseTarget = document.getElementById('pulse-target');
      var maxPulseResult = document.getElementById('max-pulse-result');
      var builtinTemplate = document.getElementById('builtin-template');
      var userProfile = document.getElementById('user-profile');
      var newProfileName = document.getElementById('new-profile-name');
      var presetName = document.getElementById('preset-name');
      var savedPresets = document.getElementById('saved-presets');
      var watchSettings = document.getElementById('watch-settings');
      var watchDevice = document.getElementById('watch-device');
      var watchStatus = document.getElementById('watch-status');
      var pulseChart = document.getElementById('pulse-chart');
      var chartMessage = document.getElementById('chart-message');
      var chartHelp = document.getElementById('chart-help');
      var busy = false;
      var stopping = false;
      var canStop = false;
      var latestChart = null;
      var chartPollBusy = false;
      var chartRevision = 0;
      var chartDrag = null;
      var editedChartPlan = null;
      var liveUpdateTimer = null;
      var liveUpdateInFlight = false;
      var liveUpdateQueued = false;
      var activeProfile = null;
      var profilesByName = {};
      var svgNamespace = 'http://www.w3.org/2000/svg';

      function rememberProfile(name) {
        document.getElementById('development-link').href =
          '/udvikling?profile=' + encodeURIComponent(name);
        try {
          window.localStorage.setItem('pyergometer-profile', name);
        } catch (error) {
          status.className = 'error';
          status.textContent = t('status.rememberProfileFailed');
        }
      }

      for (var bpm = 100; bpm <= 220; bpm += 10) {
        var option = document.createElement('option');
        option.value = bpm;
        option.textContent = bpm + ' bpm';
        maxPulse.appendChild(option);
      }

      var deviceTypeSelect = document.getElementById('device-type');
      var deviceTypes = @@DEVICE_TYPES@@;
      deviceTypes.forEach(function (type) {
        var option = document.createElement('option');
        option.value = type.id;
        // A bike type without a text in the language files keeps the name from devices.py.
        var typeKey = 'device.' + type.id;
        option.textContent = t(typeKey) === typeKey ? type.label : t(typeKey);
        deviceTypeSelect.appendChild(option);
      });
      deviceTypeSelect.value = @@INITIAL_DEVICE_TYPE@@;
      document.getElementById('device').value = @@INITIAL_DEVICE@@;

      function selectedDeviceType() {
        return deviceTypes.filter(function (type) {
          return type.id === deviceTypeSelect.value;
        })[0] || deviceTypes[0];
      }

      var currentYear = new Date().getFullYear();
      birthYearInput.min = currentYear - 120;
      birthYearInput.max = currentYear - 1;

      function maxPulseSource() {
        return document.querySelector('input[name="max-pulse-source"]:checked').value;
      }

      function selectedAge() {
        if (!birthYearInput.value || !birthYearInput.validity.valid) return null;
        return currentYear - parseInt(birthYearInput.value, 10);
      }

      function selectedMaxPulse() {
        if (maxPulseSource() === 'birth_year') {
          var age = selectedAge();
          return age === null ? null : Math.floor(208 - 0.7 * age + 0.5);
        }
        return maxPulse.value ? parseInt(maxPulse.value, 10) : null;
      }

      function updateMaxPulseSource() {
        var useBirthYear = maxPulseSource() === 'birth_year';
        maxPulse.disabled = busy || useBirthYear;
        maxPulse.required = !useBirthYear;
        birthYearInput.disabled = busy;
        birthYearInput.required = useBirthYear;
        updateMaxPulseResult();
        updateSummary();
      }

      function updateMaxPulseResult() {
        if (maxPulseSource() === 'birth_year') {
          if (selectedAge() !== null) {
            maxPulseResult.textContent = t('maxPulse.calculated',
              {pulse: selectedMaxPulse(), age: selectedAge()});
          } else {
            maxPulseResult.textContent = t('maxPulse.formula');
          }
        } else if (maxPulse.value) {
          maxPulseResult.textContent = t('maxPulse.chosen', {pulse: maxPulse.value});
        } else {
          maxPulseResult.textContent = t('maxPulse.prompt');
        }
      }

      function flashSaved(element, text) {
        element.textContent = '✓ ' + text;
        element.classList.add('show');
        window.clearTimeout(element.hideTimer);
        element.hideTimer = window.setTimeout(function () {
          element.classList.remove('show');
        }, 4000);
      }

      function requireMaxPulse() {
        if (selectedMaxPulse() !== null) return true;
        profilePanel.open = true;
        status.className = 'error';
        status.textContent = t('status.chooseMaxPulse', {profile: activeProfile || ''});
        return false;
      }

      function applyProfileMaxPulse() {
        var profile = profilesByName[activeProfile];
        var saved = profile && profile.max_pulse;
        var source = saved ? saved.source : 'manual';
        document.querySelector(
          'input[name="max-pulse-source"][value="' + source + '"]'
        ).checked = true;
        maxPulse.value = saved && saved.source === 'manual' ? String(saved.value) : '';
        var birthYear = (profile && profile.birth_year) ||
          (saved && saved.source === 'birth_year' ? saved.birth_year : '');
        birthYearInput.value = birthYear || '';
        sexSelect.value = (profile && profile.sex) || '';
        weightInput.value = profile && profile.weight_kg ? profile.weight_kg : '';
        updateMaxPulseSource();
      }

      function saveProfileDetails() {
        if (!activeProfile) return;
        var profileName = activeProfile;
        var weight = parseFloat(weightInput.value);
        var details = {
          birth_year: selectedAge() !== null ? parseInt(birthYearInput.value, 10) : null,
          sex: sexSelect.value || null,
          weight_kg: weightInput.value && weightInput.validity.valid && isFinite(weight) ? weight : null
        };
        fetch('/api/profiles', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({action: 'save-details', profile: profileName, details: details})
        }).then(function (response) {
          return response.json().then(function (data) {
            if (!response.ok) throw new Error(I18N.serverError(data, 'error.saveProfile'));
            return data.profiles;
          });
        }).then(function (profiles) {
          profiles.forEach(function (profile) {
            profilesByName[profile.name] = profile;
          });
          flashSaved(document.getElementById('details-saved'), t('saved.onProfile', {profile: profileName}));
        }).catch(function (error) {
          status.className = 'error';
          status.textContent = error.message;
        });
      }

      function saveProfileMaxPulse() {
        var source = maxPulseSource();
        var payload = null;
        if (source === 'manual' && maxPulse.value) {
          payload = {source: 'manual', value: parseInt(maxPulse.value, 10)};
        } else if (source === 'birth_year' && selectedAge() !== null) {
          payload = {source: 'birth_year', birth_year: parseInt(birthYearInput.value, 10)};
        }
        if (!payload || !activeProfile) return;
        var profileName = activeProfile;
        fetch('/api/profiles', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({action: 'save-max-pulse', profile: profileName, max_pulse: payload})
        }).then(function (response) {
          return response.json().then(function (data) {
            if (!response.ok) throw new Error(I18N.serverError(data, 'error.saveMaxPulse'));
            return data.profiles;
          });
        }).then(function (profiles) {
          profiles.forEach(function (profile) {
            profilesByName[profile.name] = profile;
          });
          flashSaved(maxPulseSaved, t('saved.onProfile', {profile: profileName}));
        }).catch(function (error) {
          status.className = 'error';
          status.textContent = error.message;
        });
      }

      function currentBlockTarget(block, elapsed, plan) {
        if (!block) return '';
        if (block.type === 'recovery') return t('target.recovery');
        if (block.type === 'interval') return t('target.bpm', {value: block.pulse});
        if (block.type === 'power') return t('target.watts', {value: block.power});
        if (block.type === 'ramp') {
          var value = Math.floor(block.start_value + (block.end_value - block.start_value) *
            (elapsed - block.start) / (block.end - block.start) + 0.5);
          return t(block.kind === 'pulse' ? 'target.bpm' : 'target.watts', {value: value});
        }
        return t(plan && plan.mode === 'power' ? 'target.watts' : 'target.pause', {value: block.power});
      }

      function updatePulseBadge(data) {
        var points = data && data.mode !== 'preview' ? data.points || [] : [];
        var live = Boolean(data && data.active && points.length);
        var last = points.length ? points[points.length - 1] : null;
        pulseBadge.classList.toggle('live', live);
        updateCadence(data);
        pulseBadge.classList.toggle('idle', !live);
        pulseNow.textContent = live ? last.pulse : '--';
        pulseBadge.setAttribute('aria-label', live
          ? t('pulse.aria.live', {pulse: last.pulse})
          : t('pulse.aria.none'));
        if (!live) {
          pulseTarget.textContent = t(data && data.active ? 'pulse.waiting' : 'pulse.none');
          return;
        }
        if (data.limited) {
          pulseTarget.textContent = t('pulse.limited');
          return;
        }
        if (Date.now() < targetFeedbackUntil) return;
        var block = ((data.plan && data.plan.blocks) || []).filter(function (item) {
          return last.elapsed >= item.start && last.elapsed < item.end;
        })[0];
        pulseTarget.textContent = currentBlockTarget(block, last.elapsed, data.plan);
      }

      // Pedalling cadence under the heart, only while a workout or livedemo runs.
      function updateCadence(data) {
        var cadence = document.getElementById('cadence');
        var running = Boolean(data && data.active && data.mode !== 'preview');
        cadence.hidden = !running;
        if (!running) return;
        cadence.textContent = typeof data.rpm === 'number'
          ? t('cadence.value', {rpm: data.rpm}) : t('cadence.none');
      }

      function makeField(labelText, type, value, min, max, step, className) {
        var label = document.createElement('label');
        label.textContent = labelText;
        var input = document.createElement('input');
        input.type = type;
        input.value = value;
        input.min = min;
        input.max = max;
        input.step = step;
        input.required = true;
        if (className) input.className = className;
        label.appendChild(input);
        return label;
      }

      function updateSummary() {
        var rows = blocks.querySelectorAll('.block');
        var totalSeconds = 0;
        var lines = [];
        var selectedMax = selectedMaxPulse();
        var powerMode = workoutMode === 'power';

        Array.prototype.forEach.call(rows, function (row, index) {
          var type = row.dataset.type;
          if (type === 'repeat') {
            var count = parseInt(row.querySelector('.count').value, 10);
            var workSeconds = parseInt(row.querySelector('.work-seconds').value, 10);
            var recoverySeconds = parseInt(row.querySelector('.recovery-seconds').value, 10);
            if (row.querySelector('.count').validity.valid &&
                row.querySelector('.work-seconds').validity.valid &&
                row.querySelector('.recovery-seconds').validity.valid) {
              totalSeconds += count * (workSeconds + recoverySeconds);
            }
            lines.push(t('summary.repeat', {count: count, work: workSeconds, recovery: recoverySeconds}));
            if (powerMode) {
              lines.push(t('summary.repeat.watts', {work: row.querySelector('.work-power').value,
                recovery: row.querySelector('.recovery-power').value}));
            } else if (selectedMax) {
              lines.push(t('summary.repeat.percent', {work: row.querySelector('.work-percent').value,
                recovery: row.querySelector('.recovery-percent').value}));
            }
            return;
          }
          if (type === 'recovery') {
            var recoverySeconds = parseInt(row.querySelector('.seconds').value, 10) || 0;
            totalSeconds += recoverySeconds;
            lines.push(t('summary.recovery', {seconds: recoverySeconds}));
            return;
          }
          var minutesField = row.querySelector('.minutes');
          var minutes = parseFloat(minutesField.value);
          if (minutesField.validity.valid && isFinite(minutes) && minutes > 0) {
            totalSeconds += Math.round(minutes * 60);
          }
          if (type === 'interval' && powerMode) {
            lines.push(t('summary.step', {number: index + 1, watts: row.querySelector('.power').value}));
          } else if (type === 'interval') {
            var percent = parseInt(row.querySelector('.percent').value, 10);
            if (selectedMax && isFinite(percent)) {
              lines.push(t('summary.interval', {number: index + 1,
                pulse: Math.floor((selectedMax * percent + 50) / 100), percent: percent}));
            }
          } else if (type === 'ramp' && powerMode) {
            lines.push(t('summary.ramp.watts', {from: row.querySelector('.start-power').value,
              to: row.querySelector('.end-power').value}));
          } else if (type === 'ramp') {
            lines.push(t('summary.ramp.percent', {from: row.querySelector('.start-percent').value,
              to: row.querySelector('.end-percent').value}));
          }
        });

        var totalMinutes = Math.floor(totalSeconds / 60);
        var remainingSeconds = totalSeconds % 60;
        summary.textContent = rows.length
          ? t(remainingSeconds ? 'summary.total.seconds' : 'summary.total',
              {minutes: totalMinutes, seconds: remainingSeconds}) +
            (lines.length ? ' · ' + lines.join(' · ') : '')
          : t('summary.empty');
        renderChart(latestChart);
        updateWorkoutName();
        updatePulseLimitToggle();
      }

      // Share of maximum pulse at which a watt workout lowers its load (as on the server).
      var PULSE_LIMIT_PERCENT = 95;

      function updatePulseLimitToggle() {
        var row = document.getElementById('pulse-limit-row');
        var text = document.getElementById('pulse-limit-text');
        var maximum = selectedMaxPulse();
        // Only shown for a watt workout that has something to run.
        row.hidden = workoutMode !== 'power' || !blocks.children.length;
        pulseLimitBox.disabled = busy || !maximum;
        if (!maximum) {
          text.textContent = t('limit.inactive');
        } else if (pulseLimitBox.checked) {
          text.textContent = t('limit.on', {percent: PULSE_LIMIT_PERCENT,
            pulse: Math.floor(maximum * PULSE_LIMIT_PERCENT / 100)});
        } else {
          text.textContent = t('limit.off');
        }
        row.classList.toggle('off', !maximum || !pulseLimitBox.checked);
      }

      // A running workout or livedemo: both take plan changes and +/- at once.
      function liveWorkoutRunning() {
        return latestChart && latestChart.active &&
          (latestChart.mode === 'real' || latestChart.mode === 'demo');
      }

      // Steps for the +/- buttons: pulse targets in percent of max, loads in watts.
      var PULSE_STEP_PERCENT = 2;
      var POWER_STEP_WATTS = 10;

      function updateAdjustButtons() {
        var running = Boolean(liveWorkoutRunning()) && !stopping;
        targetUpButton.disabled = !running;
        targetDownButton.disabled = !running;
      }

      function adjustCurrentTarget(direction) {
        if (!liveWorkoutRunning()) return;
        var plan = latestChart.plan;
        var elapsed = latestChart.elapsed || 0;
        var block = ((plan && plan.blocks) || []).filter(function (item) {
          return elapsed >= item.start && elapsed < item.end;
        })[0];
        var row = block && blocks.querySelectorAll('.block')[block.index];
        if (!row || block.type === 'recovery') return;
        var fieldNames, minimum, maximum, step, unit;
        var pulseTarget = block.type === 'interval' || (block.type === 'ramp' && block.kind === 'pulse');
        if (block.type === 'interval') {
          fieldNames = [block.repeat_phase === 'work' ? 'work-percent'
            : block.repeat_phase === 'recovery' ? 'recovery-percent' : 'percent'];
        } else if (block.type === 'power') {
          fieldNames = [block.repeat_phase === 'work' ? 'work-power'
            : block.repeat_phase === 'recovery' ? 'recovery-power' : 'power'];
        } else if (block.type === 'ramp') {
          fieldNames = block.kind === 'pulse' ? ['start-percent', 'end-percent']
            : ['start-power', 'end-power'];
        } else {
          fieldNames = ['power'];
        }
        if (pulseTarget) {
          minimum = 1; maximum = 100; step = PULSE_STEP_PERCENT; unit = '%';
        } else {
          minimum = 25; maximum = block.type === 'break' ? 400 : 1000;
          step = POWER_STEP_WATTS; unit = ' W';
        }
        var values = fieldNames.map(function (fieldName) {
          var field = row.querySelector('.' + fieldName);
          var value = Math.max(minimum, Math.min(maximum,
            (parseInt(field.value, 10) || 0) + direction * step));
          setBlockField(block.index, fieldName, value);
          return value;
        });
        // Confirm under the heart, not in the top bar: a longer status text there
        // wraps on a phone, changes the bar's height and makes the chart jump.
        if (block.type === 'interval') {
          showTargetFeedback(t('target.bpm', {value: Math.floor((plan.max_pulse * values[0] + 50) / 100)}));
        } else if (block.type === 'ramp') {
          showTargetFeedback(t(pulseTarget ? 'summary.ramp.percent' : 'summary.ramp.watts',
            {from: values[0], to: values[1]}));
        } else {
          showTargetFeedback(t('target.watts', {value: values[0]}));
        }
      }

      var targetFeedbackUntil = 0;
      var targetFeedbackTimer = null;

      function showTargetFeedback(text) {
        // Keep the new target visible until the controller has picked it up.
        targetFeedbackUntil = Date.now() + 2500;
        pulseTarget.textContent = text;
        pulseTarget.classList.add('flash');
        window.clearTimeout(targetFeedbackTimer);
        targetFeedbackTimer = window.setTimeout(function () {
          pulseTarget.classList.remove('flash');
        }, 1500);
      }

      targetUpButton.addEventListener('click', function () { adjustCurrentTarget(1); });
      targetDownButton.addEventListener('click', function () { adjustCurrentTarget(-1); });

      function sendLiveUpdate() {
        if (!liveWorkoutRunning()) return;
        if (liveUpdateInFlight) {
          liveUpdateQueued = true;
          return;
        }

        var plan = getPlan();
        // A live change keeps the running workout's name (without "(ændret)").
        if (latestChart.plan && latestChart.plan.name) plan.name = latestChart.plan.name;
        liveUpdateInFlight = true;
        fetch('/api/update', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(plan)
        }).then(function (response) {
          return response.json().then(function (data) {
            if (!response.ok) throw new Error(I18N.serverError(data, 'error.liveUpdate'));
            return data;

      }

      function scheduleLiveUpdate(immediate) {
        if (!liveWorkoutRunning()) return;

        renderChart(latestChart);

          sendLiveUpdate();
        } else {
          liveUpdateTimer = window.setTimeout(function () {

            sendLiveUpdate();

      }

      function chartPlanFromForm() {
        var maximum = selectedMaxPulse();
        var powerMode = workoutMode === 'power';
        var pulseValue = function (percent) {
          return maximum ? Math.floor((maximum * percent + 50) / 100) : percent;
        };
        var number = function (row, className) {
          var field = row.querySelector('.' + className);
          return field && field.validity.valid ? parseFloat(field.value) : NaN;
        };
        var elapsed = 0;
        var chartBlocks = [];
        var add = function (entry, duration) {
          entry.start = elapsed;
          entry.end = elapsed + duration;
          chartBlocks.push(entry);
          elapsed += duration;
        };
        Array.prototype.forEach.call(blocks.querySelectorAll('.block'), function (row, index) {
          var type = row.dataset.type;
          if (type === 'repeat') {
            var count = number(row, 'count');
            var phases = ['work', 'recovery'].map(function (phase) {
              return {
                phase: phase,
                seconds: number(row, phase + '-seconds'),
                value: number(row, phase + (powerMode ? '-power' : '-percent'))
              };
            });
            if (!isFinite(count) || phases.some(function (phase) {
              return !isFinite(phase.seconds) || !isFinite(phase.value);
            })) return;
            for (var repeatIndex = 0; repeatIndex < count; repeatIndex += 1) {
              phases.forEach(function (phase) {
                var entry = powerMode
                  ? {type: 'power', power: phase.value}
                  : {type: 'interval', pulse: pulseValue(phase.value), percent: phase.value};
                entry.index = index;
                entry.draggable = false;
                entry.repeat_phase = phase.phase;
                add(entry, phase.seconds);

            }
            return;
          }
          if (type === 'recovery') {
            var recoverySeconds = number(row, 'seconds');
            if (!isFinite(recoverySeconds)) return;
            add({type: 'recovery', power: 25, index: index, draggable: false}, recoverySeconds);
            return;
          }
          var minutes = number(row, 'minutes');
          if (!isFinite(minutes) || minutes <= 0) return;
          var duration = Math.round(minutes * 60);
          var entry;
          if (type === 'interval' && powerMode) {
            if (!isFinite(number(row, 'power'))) return;
            entry = {type: 'power', power: number(row, 'power')};
          } else if (type === 'interval') {
            var percent = number(row, 'percent');
            if (!isFinite(percent)) return;
            entry = {type: 'interval', pulse: pulseValue(percent), percent: percent};
          } else if (type === 'ramp') {
            var first = number(row, powerMode ? 'start-power' : 'start-percent');
            var last = number(row, powerMode ? 'end-power' : 'end-percent');
            if (!isFinite(first) || !isFinite(last)) return;
            entry = powerMode
              ? {type: 'ramp', kind: 'power', start_value: first, end_value: last}
              : {type: 'ramp', kind: 'pulse', start_percent: first, end_percent: last,
                 start_value: pulseValue(first), end_value: pulseValue(last)};
          } else {
            if (!isFinite(number(row, 'power'))) return;

          }
          entry.index = index;
          add(entry, duration);
        });
        return {
          mode: workoutMode,
          max_pulse: maximum || (powerMode ? null : 100),
          pulse_unit: maximum || powerMode ? 'bpm' : 'percent',
          duration: elapsed,
          blocks: chartBlocks

      }

      function pulseAxisMax(plan) {
        if (plan.pulse_unit === 'percent') return 100;
        return Math.max(200, Math.ceil(((plan.max_pulse || 190) + 10) / 50) * 50);
      }

      function powerAxisMax(plan) {
        var highest = 0;
        plan.blocks.forEach(function (block) {
          if (block.type === 'power' || block.type === 'break') {
            highest = Math.max(highest, block.power);
          } else if (block.type === 'ramp' && block.kind === 'power') {
            highest = Math.max(highest, block.start_value, block.end_value);

      function svgElement(name, attributes, text) {
        var element = document.createElementNS(svgNamespace, name);
        Object.keys(attributes || {}).forEach(function (key) {
          element.setAttribute(key, attributes[key]);
        });
        if (text !== undefined) element.textContent = text;
        return element;
      }

      function timeTickStep(duration) {
        var steps = [15, 30, 60, 120, 300, 600, 900, 1800, 3600];
        for (var index = 0; index < steps.length; index += 1) {
          if (duration / steps[index] <= 8) return steps[index];
        }
        return steps[steps.length - 1];
      }

      function clock(seconds) {
        var remainder = Math.floor(seconds) % 60;
        return Math.floor(seconds / 60) + ':' + (remainder < 10 ? '0' : '') + remainder;
      }

      // Guidance during fitness tests and pulse drops, in the workout's own times
      // (the times on the chart's x-axis).
      var ASTRAND_SETTLE = 240;
      function updateTestGuide(data) {
        var guide = document.getElementById('test-guide');
        var points = data && data.active && data.mode !== 'preview' ? data.points || [] : [];
        var last = points.length ? points[points.length - 1] : null;
        var block = last && ((data.plan && data.plan.blocks) || []).filter(function (item) {
          return last.elapsed >= item.start && last.elapsed < item.end;
        })[0];
        if (!block || (!block.test && block.type !== 'recovery')) {
          guide.hidden = true;
          return;
        }
        var average = function (from, to) {
          var pulses = points.filter(function (point) {
            return point.elapsed >= from && point.elapsed < to && point.pulse >= 20;
          }).map(function (point) { return point.pulse; });
          return pulses.length
            ? Math.round(pulses.reduce(function (a, b) { return a + b; }, 0) / pulses.length) : null;
        };
        var now = last.elapsed;
        var text;
        var warn = false;
        if (block.test === 'astrand') {
          var from = block.start + ASTRAND_SETTLE;
          var middle = from + 60;
          if (now < from) {
            text = t('guide.astrand.settle', {from: clock(from), to: clock(block.end)});
            if (now >= block.start + 180 && last.pulse >= 20 && (last.pulse < 115 || last.pulse > 170)) {
              warn = true;
              text += ' ' + t(last.pulse < 115 ? 'guide.astrand.tooLow' : 'guide.astrand.tooHigh',
                {pulse: last.pulse});
            }
          } else if (now < middle) {
            text = t('guide.astrand.first', {from: clock(from), to: clock(middle),
              average: average(from, middle) || '–'});
          } else {
            var first = average(from, middle);
            var second = average(middle, block.end);
            var difference = first && second ? Math.abs(second - first) : null;
            text = t(difference !== null ? 'guide.astrand.second.difference' : 'guide.astrand.second',
              {from: clock(middle), to: clock(block.end), firstFrom: clock(from), firstTo: clock(middle),
               first: first || '–', now: second || '–', difference: difference});
            if (difference !== null && difference > 5) {
              warn = true;
              text += ' ' + t('guide.astrand.unstable');
            }
            if (second && (second < 120 || second > 170)) {
              warn = true;
              text += ' ' + t('guide.astrand.range');
            }
          }
        } else if (block.test === 'ramp') {
          var peak = points.filter(function (point) { return point.elapsed >= block.start; })
            .reduce(function (highest, point) { return Math.max(highest, point.pulse || 0); }, 0);
          var watts = Math.floor(block.start_value + (block.end_value - block.start_value) *
            (now - block.start) / (block.end - block.start) + 0.5);
          text = t('guide.ramp', {watts: watts, peak: peak || '–'});
        } else {
          var startPulse = average(block.start - 3, block.start + 2);
          text = t('guide.recovery', {until: clock(Math.min(block.end, block.start + 60)),
            start: clock(block.start), startPulse: startPulse || '–',
            now: last.pulse >= 20 ? last.pulse : '–'});
        }
        guide.textContent = text;
        guide.classList.toggle('warn', warn);
        guide.hidden = false;
      }

      function formatTickTime(seconds, step) {

      }

        chartHelp.textContent = t(powerMode ? 'chart.help.power' : 'chart.help.pulse');
        var width = 900;
        var height = 400;
        var left = 70;
        // A watt chart needs room on the right for the pulse axis.

        var top = 24;

            }));
            pulseChart.appendChild(svgElement('line', {

      function chartPosition(event) {
